name: Build bilingual macOS app

# This fork never deploys the upstream website or publishes automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test localization and existing behavior
        working-directory: WhatThePort
        run: swift test --jobs 4
      - name: Build the independent bilingual edition
        working-directory: WhatThePort
        run: ./build-localized.sh
      - name: Verify and package
        run: |
          codesign --verify --deep --strict WhatThePort/.build/WhatThePort.app
          ditto -c -k --sequesterRsrc --keepParent WhatThePort/.build/WhatThePort.app WhatThePort-ZH-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WhatThePort-ZH-${{ runner.arch }}
          path: WhatThePort-ZH-${{ runner.arch }}.zip
          retention-days: 14
